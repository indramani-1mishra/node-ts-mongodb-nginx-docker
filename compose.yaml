services:
  app:

    image: indrama/docker_with_nginx-app:${IMAGE_TAG}
    container_name: node_with_ngnix
    env_file:
      - .env
    networks:
      - my-app-network
    ports:
      - "4000:4000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "src/server.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  nginx:
     image: nginx:alpine
     ports:
      - "80:80"
     volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
     networks:
      - my-app-network
     depends_on:
      - app
  db:
    image: mongo:7
    container_name: db
    environment:
      - mongoUrl= mongodb://mongodb/safehandnewbackend25
    volumes:
      - mongodb-data:/data/mongodata
    networks:
      - my-app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  mongodb-data:
networks:
  my-app-network: